<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPCA2026 タイムテーブル｜Off-the-JT 単位×会場</title>
<style>
  :root{
    --green:#1f6f54; --green-d:#15503c; --bg:#eef5f7; --card:#ffffff;
    --orange:#e8843c; --ink:#1d2a2a; --muted:#6b7c7c; --line:#dde8e8;
    --c-edu:#2f7dd1; --c-cli:#1f9d72; --c-mgmt:#9b59b6; --c-res:#c0392b; --c-oth:#8a9a9a;
    --shadow:0 1px 2px rgba(20,60,50,.06),0 6px 18px rgba(20,60,50,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",
                "Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  header.top{
    background:linear-gradient(120deg,var(--green-d),var(--green));
    color:#fff; padding:18px 16px 16px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  header.top h1{font-size:1.18rem;margin:0;font-weight:700;letter-spacing:.02em}
  header.top p{margin:4px 0 0;font-size:.78rem;opacity:.85}
  .sticky{
    position:sticky;top:0;z-index:30;background:rgba(238,245,247,.96);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
    padding:10px 16px;
  }
  .filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .filter-row:last-child{margin-bottom:0}
  .flabel{font-size:.7rem;color:var(--muted);font-weight:700;margin-right:2px;min-width:34px}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:5px 12px;border-radius:999px;font-size:.8rem;cursor:pointer;
    transition:all .12s;user-select:none;white-space:nowrap;
  }
  .chip:hover{border-color:var(--green)}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
  .chip[data-dom].on{color:#fff}
  .chip.dom-edu.on{background:var(--c-edu);border-color:var(--c-edu)}
  .chip.dom-cli.on{background:var(--c-cli);border-color:var(--c-cli)}
  .chip.dom-mgmt.on{background:var(--c-mgmt);border-color:var(--c-mgmt)}
  .chip.dom-res.on{background:var(--c-res);border-color:var(--c-res)}
  .chip.dom-oth.on{background:var(--c-oth);border-color:var(--c-oth)}
  .search{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;font-size:.82rem;font-family:inherit}
  .count{font-size:.74rem;color:var(--muted);margin:10px 16px 0}
  main{padding:4px 16px 60px}
  .timeblock{margin-top:18px}
  .tb-head{
    display:flex;align-items:baseline;gap:8px;
    border-left:4px solid var(--orange);padding-left:10px;margin-bottom:10px;
  }
  .tb-head .t{font-size:1.02rem;font-weight:700}
  .tb-head .d{font-size:.74rem;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .card{
    background:var(--card);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow);
    border-left:5px solid var(--c-oth);position:relative;
  }
  .card.d-edu{border-left-color:var(--c-edu)}
  .card.d-cli{border-left-color:var(--c-cli)}
  .card.d-mgmt{border-left-color:var(--c-mgmt)}
  .card.d-res{border-left-color:var(--c-res)}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
  .room{
    background:var(--green-d);color:#fff;font-size:.74rem;font-weight:700;
    padding:2px 9px;border-radius:6px;letter-spacing:.02em;
  }
  .badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
  .b-edu{background:var(--c-edu)} .b-cli{background:var(--c-cli)}
  .b-mgmt{background:var(--c-mgmt)} .b-res{background:var(--c-res)} .b-oth{background:var(--c-oth)}
  .sess{font-size:.7rem;color:var(--muted);font-weight:600}
  .title{font-size:.9rem;font-weight:600;line-height:1.45;margin:2px 0 8px}
  .credits{display:flex;gap:6px;flex-wrap:wrap}
  .cr{font-size:.66rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
  .cr b{color:var(--orange);font-weight:700}
  .cr.off{opacity:.35}
  .empty{text-align:center;color:var(--muted);padding:50px 0;font-size:.9rem}
  footer{padding:18px 16px 30px;color:var(--muted);font-size:.72rem;text-align:center}
  @media(max-width:520px){
    .grid{grid-template-columns:1fr}
    header.top h1{font-size:1.02rem}
  }
</style>
</head>

<header class="top"><div class="wrap">

<div class="count" id="count"></div>
<main><div class="wrap" id="list"></div></main>

    (fDate==="all"||d.date===fDate) &&
    (fDom==="all"||d.domain===fDom) &&
    (fQ===""||(d.title+d.room+d.sess).toLowerCase().includes(fQ))
  );
  document.getElementById('count').textContent = `${rows.length} 件表示`;
  if(!rows.length){list.innerHTML='<div class="empty">該当するセッションがありません</div>';return;}

  // 日付→時間枠でグループ化
  const groups={};
  rows.forEach(d=>{
    const k=d.date+"|"+d.start+"|"+d.end;
    (groups[k]=groups[k]||[]).push(d);
  });
  const keys=Object.keys(groups).sort((a,b)=>{
    const [da,sa]=a.split("|"),[db,sb]=b.split("|");
    return da===db ? sa.localeCompare(sb) : da.localeCompare(db);
  });

  let html="",lastDate="";
  keys.forEach(k=>{
    const [date,start,end]=k.split("|");
    if(date!==lastDate){lastDate=date;html+=`<div style="margin-top:22px;font-weight:800;color:var(--green-d);font-size:1.05rem">${DAY_LABEL[date]}</div>`;}
    html+=`<div class="timeblock"><div class="tb-head"><span class="t">${start}–${end}</span><span class="d">${groups[k].length}セッション</span></div><div class="grid">`;
    groups[k].forEach(d=>{
      const dk=DOM_KEY[d.domain]||"oth";
      const domLabel = d.sub || d.domain;
      html+=`<div class="card d-${dk}">
        <div class="meta">
          <span class="room">${d.room}</span>
          <span class="badge b-${dk}">${domLabel}</span>
          <span class="sess">${d.sess}</span>
        </div>
        <div class="title">${d.title}</div>
        <div class="credits">
          ${credit("現地",d.local)}${credit("LIVE",d.live)}${credit("録画",d.ondemand)}
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  list.innerHTML=html;
}
render();
</script>
</body>
</html>
